name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  smoke:
    name: Runtime smoke test
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start production server and probe routes
        run: |
          npm run start -- -p 3000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          for path in / /contacto /faqs /galeria /nosotros /programas /requisitos /proyectos /servicios; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

          curl -sf http://localhost:3000/videos/recorrido-3d.mp4 -o /dev/null
          curl -sf http://localhost:3000/logo.png -o /dev/null

          echo "All routes OK"